name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ai]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: OpenAPI schema is up to date
        run: |
          python -m app.export_openapi > ../frontend/lib/api/openapi.json
          git diff --exit-code -- ../frontend/lib/api/openapi.json || {
            echo "::error::frontend/lib/api/openapi.json is stale. Run: cd backend && python -m app.export_openapi > ../frontend/lib/api/openapi.json && cd ../frontend && npm run gen:types";
            exit 1;
          }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- lib/api/schema.gen.ts || {
            echo "::error::lib/api/schema.gen.ts is stale. Run: npm run gen:types";
            exit 1;
          }
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t repolens-backend:ci backend
      - name: Build frontend image
        run: docker build -t repolens-frontend:ci frontend
      - name: Smoke test backend image
        run: |
          docker run -d --name api -p 8000:8000 repolens-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
