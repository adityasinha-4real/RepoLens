# Render Blueprint for the RepoLens API (free web service). The frontend is deployed to Vercel.
# See docs/deployment.md.
services:
  - type: web
    name: repolens-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: TRUST_PROXY_HEADERS
        value: "false" # the API is public on Render; do not trust client-supplied headers
      - key: PROXY_SHARED_SECRET
        sync: false # same random value as REPOLENS_PROXY_SECRET on Vercel
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
